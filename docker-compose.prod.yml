name: abvos-prod

services:
  # --- FastAPI Backend (Python 3.12) -----------------------------------------
  app-py:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: abvos/app-py:prod
    container_name: abvos-prod-app-py
    working_dir: /app
    env_file:
      - ./.env.production
    volumes:
      - ./backend-python:/app
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-abvos}
      - DB_USERNAME=${DB_USERNAME:-abvos}
      - DB_PASSWORD=${DB_PASSWORD:-abvos_prod_pass_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-abvos_redis_pass_2026}
    networks:
      - abvos-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # --- Nginx 1.27 (Reverse Proxy + Static SPA Servindo frontend/dist) ---------
  web:
    image: nginx:1.27-alpine
    container_name: abvos-prod-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - abvos-prod-network
    depends_on:
      - app-py
    restart: always

  # --- MySQL 8.0 ---------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: abvos-prod-db
    command: --defaults-extra-file=/etc/mysql/conf.d/abvos.cnf
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-abvos}
      MYSQL_USER: ${DB_USERNAME:-abvos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-abvos_prod_pass_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-abvos_root_secret_2026}
      TZ: America/Sao_Paulo
    volumes:
      - db_prod_data:/var/lib/mysql
      - ./docker/mysql/abvos.cnf:/etc/mysql/conf.d/abvos.cnf:ro
    networks:
      - abvos-prod-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: always

  # --- Redis 7 (Cache, Queues e Locks) ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: abvos-prod-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-abvos_redis_pass_2026}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-abvos_redis_pass_2026}
    volumes:
      - redis_prod_data:/data
    networks:
      - abvos-prod-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

networks:
  abvos-prod-network:
    driver: bridge

volumes:
  db_prod_data:
  redis_prod_data:
