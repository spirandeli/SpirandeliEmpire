; Supervisor do container `worker`.
; Mantém 24/7: filas do agente (Redis) e o scheduler do Laravel.
;
; Filas (ordem de prioridade):
;   agent        -> loops do Gemini (chat, orquestração, revisões)
;   tiktok       -> mineração / geração de conteúdo TikTok Shop
;   integrations -> sync Google / Apple CalDAV
;   default      -> demais jobs

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; --- Scheduler: roda `schedule:run` a cada minuto (long-running) ---------------
[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Workers do agente (Gemini) ------------------------------------------------
; --timeout deve ser MENOR que retry_after (REDIS_QUEUE_RETRY_AFTER=420)
[program:laravel-queue-agent]
command=php /var/www/html/artisan queue:work redis --queue=agent --sleep=2 --tries=3 --backoff=15 --timeout=300 --max-time=3600 --max-jobs=500 --memory=256
user=www-data
directory=/var/www/html
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Workers gerais (TikTok, integrações, default) -------------------------------
[program:laravel-queue-general]
command=php /var/www/html/artisan queue:work redis --queue=tiktok,integrations,default --sleep=3 --tries=3 --backoff=30 --timeout=300 --max-time=3600 --max-jobs=1000 --memory=256
user=www-data
directory=/var/www/html
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
