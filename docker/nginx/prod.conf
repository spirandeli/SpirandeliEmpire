# Nginx (PRODUÇÃO): HTTPS com SSL Let's Encrypt para spirandeliempire.tech

upstream fastapi_prod {
    server app-py:8000;
}

# Redirecionamento HTTP -> HTTPS (porta 80 -> 443)
server {
    listen 80;
    server_name spirandeliempire.tech www.spirandeliempire.tech 187.41.117.220;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Principal HTTPS (porta 443)
server {
    listen 443 ssl http2;
    server_name spirandeliempire.tech www.spirandeliempire.tech 187.41.117.220;

    root /var/www/frontend;
    index index.html;
    charset utf-8;
    client_max_body_size 64m;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/nginx/ssl/spirandeliempire.tech.crt;
    ssl_certificate_key /etc/nginx/ssl/spirandeliempire.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- API FastAPI (Python 3.12) & Streaming SSE & Outputs Mídia ------------
    location ~ ^/(api|up|outputs|media) {
        proxy_pass http://fastapi_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }

    # --- Assets estáticos com hash (Cache de 1 ano) ----------------------------
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bloqueia arquivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- SPA Vue 3 (Fallback para index.html do Vue Router) ---------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
