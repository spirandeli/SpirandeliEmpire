# Nginx (PRODUÇÃO): HTTPS com SSL Let's Encrypt para spirandeliempire.tech

upstream php_fpm {
    server app:9000;
}

# Redirecionamento HTTP -> HTTPS (porta 80 -> 443)
server {
    listen 80;
    server_name spirandeliempire.tech www.spirandeliempire.tech 187.41.117.220;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Principal HTTPS (porta 443)
server {
    listen 443 ssl http2;
    server_name spirandeliempire.tech www.spirandeliempire.tech 187.41.117.220;

    root /var/www/frontend;
    index index.html;
    charset utf-8;
    client_max_body_size 64m;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/nginx/ssl/spirandeliempire.tech.crt;
    ssl_certificate_key /etc/nginx/ssl/spirandeliempire.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- Streaming do Agente (SSE): sem buffering -------------------------------
    location = /api/agent/stream {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass php_fpm;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache";
    }

    # --- API Laravel e rotas de backend -----------------------------------------
    location ~ ^/(api|sanctum|up) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # --- Storage do Laravel (Uploads e mídias) ----------------------------------
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Assets estáticos com hash (Cache de 1 ano) ----------------------------
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bloqueia arquivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- SPA Vue 3 (Fallback para index.html do Vue Router) ---------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
