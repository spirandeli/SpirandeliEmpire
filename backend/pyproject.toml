[project]
name = "spirandeliempire-os"
version = "3.1.0"
description = "SpirandeliEmpire OS 3.1 — LangGraph Edition: Autonomous AI Digital Company"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "google-genai>=0.1.1",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.17",
    "cryptography>=43.0.3",
    "psutil>=6.1.0",
    "pillow>=10.0.0",
    "websockets>=13.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
