[project]
name = "abvos-backend"
version = "0.1.0"
description = "Autonomous Business Venture OS - Python FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.2",
    "google-genai>=0.1.1",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "python-multipart>=0.0.12",
    "croniter>=3.0.3",
    "icalendar>=6.0.0",
    "greenlet>=3.1.1",
    "email-validator>=2.2.0",
    "psutil>=7.0.0",
    "chromadb>=1.5.0",
    "edge-tts>=7.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
