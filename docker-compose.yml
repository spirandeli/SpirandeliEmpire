name: abvos

# Autonomous Business Venture OS - Ambiente Docker FastAPI (Python) + Vue 3 (Vite).

services:
  # --- FastAPI Backend (Python 3.12) -----------------------------------------
  app-py:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: abvos/app-py:dev
    container_name: abvos-app-py
    working_dir: /app
    env_file:
      - ./.env
    volumes:
      - ./backend-python:/app
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - abvos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Node: Vite + Vue 3 (HMR) ----------------------------------------------
  node:
    image: node:22-alpine
    container_name: abvos-node
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - HOME=/tmp
      - VITE_HMR_CLIENT_PORT=${WEB_PORT:-8080}
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - abvos
    restart: unless-stopped

  # --- Nginx: reverse proxy (API FastAPI + SPA Vue) --------------------------
  web:
    image: nginx:1.27-alpine
    container_name: abvos-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - abvos
    depends_on:
      - app-py
      - node
    restart: unless-stopped

  # --- MySQL 8.0 ---------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: abvos-db
    command: --defaults-extra-file=/etc/mysql/conf.d/abvos.cnf
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/abvos.cnf:/etc/mysql/conf.d/abvos.cnf:ro
    networks:
      - abvos
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # --- Redis (cache, filas, broadcasting) -----------------------------------
  redis:
    image: redis:7-alpine
    container_name: abvos-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - abvos
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Mailpit (e-mail em DEV) -----------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: abvos-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - abvos
    restart: unless-stopped

networks:
  abvos:
    driver: bridge

volumes:
  db_data:
  redis_data:
  node_modules:
