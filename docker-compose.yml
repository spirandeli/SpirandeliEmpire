name: spirandeliempire

services:
  postgres:
    image: postgres:16-alpine
    container_name: spirandeli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spirandeliempire}
      POSTGRES_USER: ${POSTGRES_USER:-spirandeli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spirandeli_secret_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spirandeli} -d ${POSTGRES_DB:-spirandeliempire}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - empire_net

  redis:
    image: redis:7-alpine
    container_name: spirandeli-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - empire_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spirandeli-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-spirandeli-empire-super-secret-master-key-32b-min}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-spirandeli}:${POSTGRES_PASSWORD:-spirandeli_secret_pass}@postgres:5432/${POSTGRES_DB:-spirandeliempire}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-gAamH43t9g86xK_V3zP0N5h3B9lU2mX6qT1y8oQ4z9E=}
      - ENCRYPTION_KEY_VERSION=${ENCRYPTION_KEY_VERSION:-v1}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-spirandelidev@gmail.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-public}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - ./storage:/home/spira/spirandeliempire/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1536m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - empire_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spirandeli-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-spirandeli-empire-super-secret-master-key-32b-min}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-spirandeli}:${POSTGRES_PASSWORD:-spirandeli_secret_pass}@postgres:5432/${POSTGRES_DB:-spirandeliempire}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-gAamH43t9g86xK_V3zP0N5h3B9lU2mX6qT1y8oQ4z9E=}
      - ENCRYPTION_KEY_VERSION=${ENCRYPTION_KEY_VERSION:-v1}
    volumes:
      - ./storage:/home/spira/spirandeliempire/storage
    mem_limit: 1536m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - empire_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spirandeli-frontend
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - empire_net

  nginx:
    image: nginx:1.27-alpine
    container_name: spirandeli-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - frontend
      - backend
    networks:
      - empire_net

volumes:
  postgres_data:
  redis_data:

networks:
  empire_net:
    driver: bridge
