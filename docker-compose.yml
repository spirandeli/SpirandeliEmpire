name: abvos

# Autonomous Business Venture OS - ambiente de desenvolvimento / base da VPS.
# Variáveis de interpolação vêm de ./.env (veja .env.example).
# A configuração do Laravel vem de ./backend/.env (veja backend/.env.example).

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

x-php-common: &php-common
  env_file:
    - ./backend/.env
  volumes:
    - ./backend:/var/www/html
    - composer_cache:/tmp/composer-cache
  networks:
    - abvos
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # --- Laravel (PHP-FPM) -----------------------------------------------------
  app:
    <<: *php-common
    build:
      <<: *php-build
      target: app
    image: abvos/app:dev
    container_name: abvos-app
    working_dir: /var/www/html

  # --- Worker: Supervisor (queue:work + schedule:work) 24/7 --------------------
  worker:
    <<: *php-common
    build:
      <<: *php-build
      target: worker
    image: abvos/worker:dev
    container_name: abvos-worker
    working_dir: /var/www/html
    stop_grace_period: 120s # permite que loops do Gemini em andamento terminem
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/supervisord.conf status | grep -v RUNNING && exit 1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Node: Vite + Vue 3 (HMR) ----------------------------------------------
  node:
    image: node:22-alpine
    container_name: abvos-node
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - HOME=/tmp
      - VITE_HMR_CLIENT_PORT=${WEB_PORT:-8080}
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - abvos
    restart: unless-stopped

  # --- Nginx: reverse proxy (API Laravel + SPA Vue) --------------------------
  web:
    image: nginx:1.27-alpine
    container_name: abvos-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - abvos
    depends_on:
      - app
      - node
    restart: unless-stopped

  # --- MySQL 8.0 ---------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: abvos-db
    command: --defaults-extra-file=/etc/mysql/conf.d/abvos.cnf
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/abvos.cnf:/etc/mysql/conf.d/abvos.cnf:ro
    networks:
      - abvos
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # --- Redis (cache, sessões, filas, broadcasting) ---------------------------
  redis:
    image: redis:7-alpine
    container_name: abvos-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - abvos
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Mailpit (e-mail/alertas em DEV) ----------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: abvos-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - abvos
    restart: unless-stopped

networks:
  abvos:
    driver: bridge

volumes:
  db_data:
  redis_data:
  node_modules:
  composer_cache:
